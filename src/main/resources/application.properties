spring.application.name=neoaibackend
# Runs the server on port 3000 to match your React frontend
server.port=3000

# Your MongoDB and Gemini Keys
spring.data.mongodb.uri=${MONGO_URI}
spring.ai.google.genai.api-key=${GEMINI_KEY}
spring.data.mongodb.database=neoaidb
spring.ai.google.genai.chat.options.model=gemini-3.5-flash-lite